# Builds, tests, and publishes a GitHub release when game/VERSION changes on main.
name: Publish game update
on:
  push:
    branches: [main]
    paths: [game/VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      full: true
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested release asset
        uses: actions/download-artifact@v4
        with:
          name: browser-release
          path: dist
      - name: Create the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < game/VERSION)
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" dist/naranxia.html --clobber
          else
            NOTES="Naranxia $V"; [ -f game/NOTES.md ] && NOTES="$(cat game/NOTES.md)"
            gh release create "$V" dist/naranxia.html --title "Naranxia $V" --notes "$NOTES"
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Announce on Discord
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.HOOK != '' && steps.rel.outputs.new == '1'
        run: |
          V=$(tr -d '[:space:]' < game/VERSION)
          NOTES=$(cat game/NOTES.md 2>/dev/null || echo "")
          MSG=$(printf '**Naranxia %s is out!** The game updates itself at next launch.\n\n%s' "$V" "$NOTES")
          jq -n --arg c "${MSG:0:1990}" '{username:"Naranxia",content:$c}' | curl -sS -H 'Content-Type: application/json' -d @- "$HOOK"
