# Publishes a GitHub Release every time game/VERSION changes on main.
# The desktop launcher downloads the .html asset of the latest release at start-up.
name: Publish game update
on:
  push:
    branches: [main]
    paths: [game/VERSION, game/naranxia.html]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < game/VERSION)
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" game/naranxia.html --clobber
          else
            NOTES="Naranxia $V"; [ -f game/NOTES.md ] && NOTES="$(cat game/NOTES.md)"
            gh release create "$V" game/naranxia.html --title "Naranxia $V" --notes "$NOTES"
          fi
      - name: Announce on Discord
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.HOOK != ''
        run: |
          V=$(tr -d '[:space:]' < game/VERSION)
          NOTES=$(cat game/NOTES.md 2>/dev/null || echo "")
          MSG=$(printf '**Naranxia %s is out!** The game updates itself at next launch.\n\n%s\n\nDownload: https://github.com/%s/releases/latest' "$V" "$NOTES" "$GITHUB_REPOSITORY")
          jq -n --arg c "${MSG:0:1990}" '{username:"Naranxia",content:$c}' | curl -sS -H 'Content-Type: application/json' -d @- "$HOOK"
