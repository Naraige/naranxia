# Builds, tests, and publishes a GitHub release when game/VERSION changes on main.
name: Publish game update
on:
  push:
    branches: [main]
    paths: [game/VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      full: true
  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download tested release asset
        uses: actions/download-artifact@v4
        with:
          name: browser-release
          path: dist
      - name: Create the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < game/VERSION)
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" dist/naranxia.html --clobber
          else
            NOTES="Naranxia $V"; [ -f game/NOTES.md ] && NOTES="$(cat game/NOTES.md)"
            gh release create "$V" dist/naranxia.html --title "Naranxia $V" --notes "$NOTES"
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Update banner for the announcement
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.HOOK != '' && steps.rel.outputs.new == '1'
        continue-on-error: true
        run: |
          V=$(tr -d '[:space:]' < game/VERSION)
          npm ci --ignore-scripts
          python3 -m pip install -r tests/requirements.txt Pillow
          python3 -m playwright install --with-deps chromium
          mkdir -p "announce/img/$V"
          SHOT_OUT="announce/img/$V" python3 tools/announce_banner.py "$V"
          mv "announce/img/$V/banner-$V.png" "announce/img/$V/00-banner.png"
      - name: Announce on Discord
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.HOOK != '' && steps.rel.outputs.new == '1'
        run: |
          V=$(tr -d '[:space:]' < game/VERSION)
          # embed with the release notes and the screenshots of announce/img/$V/ (tools/announce.sh)
          F=game/NOTES.md; [ -f "announce/$V.md" ] && F="announce/$V.md"
          bash tools/announce.sh "$V" "$F"
