# Publishes a GitHub Release every time game/VERSION changes on main, after the tests pass (test.yml).
# The desktop launcher downloads the .html asset of the latest release at start-up.
name: Publish game update
on:
  push:
    branches: [main]
    paths: [game/VERSION, game/naranxia.html]
  workflow_dispatch:   # run it again by hand (Actions tab) if a release was blocked
permissions:
  contents: write
jobs:
  test:
    # the release only goes out when the headless tests pass on this commit
    uses: ./.github/workflows/test.yml
    with:
      ship: true
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < game/VERSION)
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" game/naranxia.html --clobber
          else
            NOTES="Naranxia $V"; [ -f game/NOTES.md ] && NOTES="$(cat game/NOTES.md)"
            gh release create "$V" game/naranxia.html --title "Naranxia $V" --notes "$NOTES"
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Announce on Discord
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        # only for a new release: a re-run must not post the same version twice
        if: env.HOOK != '' && steps.rel.outputs.new == '1'
        run: |
          V=$(tr -d '[:space:]' < game/VERSION)
          NOTES=$(cat game/NOTES.md 2>/dev/null || echo "")
          MSG=$(printf '**Naranxia %s is out!** The game updates itself at next launch.\n\n%s' "$V" "$NOTES")
          jq -n --arg c "${MSG:0:1990}" '{username:"Naranxia",content:$c}' | curl -sS -H 'Content-Type: application/json' -d @- "$HOOK"
