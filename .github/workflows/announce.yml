# Posts the announcements listed in announce/QUEUE to Discord, one message per version, in order.
name: Announce on Discord
on:
  push:
    branches: [main]
    paths: [announce/QUEUE]
  workflow_dispatch:
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post each update
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "DISCORD_WEBHOOK secret is not set"; exit 1; }
          while read -r V; do
            [ -n "$V" ] || continue
            F="announce/$V.md"; [ -f "$F" ] || continue
            bash tools/announce.sh "$V" "$F"
            sleep 3
          done < announce/QUEUE
