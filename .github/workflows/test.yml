# Headless tests on every push that touches the game or the tests, on pull requests,
# by hand (Actions tab > tests > Run workflow), and before every release (called by release.yml).
name: tests
on:
  push:
    paths: [packages/game/**, tests/**, tools/**, game/VERSION, package.json, package-lock.json, .github/workflows/**]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: also run the save / load round trip (slow)
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: also run the save / load round trip
        type: boolean
        default: false
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Playwright 1.56 supports Ubuntu up to 24.04 (ubuntu-latest moved to 26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          npm ci
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Tests
        env:
          J: 2
        run: npm test -- ${{ inputs.full && '--full' || '' }}
      - name: Save tested release asset
        if: inputs.full
        uses: actions/upload-artifact@v4
        with:
          name: browser-release
          path: dist/naranxia.html
          if-no-files-found: error
          retention-days: 7
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: dist/test-logs
          retention-days: 7
