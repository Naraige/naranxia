# Headless tests on every push that touches the game or the tests, on pull requests,
# by hand (Actions tab > tests > Run workflow), and before every release (called by release.yml).
name: tests
on:
  push:
    paths: [packages/game/**, apps/desktop/**, tests/**, tools/**, docs/**/*.js, docs/**/*.mjs, game/VERSION, package.json, package-lock.json, .github/workflows/**, eslint.config.mjs, .prettierrc.json, .prettierignore, .editorconfig, .gitattributes]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: include deep resync and 6000-tick multiplayer soak
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: include deep resync and 6000-tick multiplayer soak
        type: boolean
        default: false
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Playwright 1.56 supports Ubuntu up to 24.04 (ubuntu-latest moved to 26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          npm ci
          pip install playwright==1.56.0
      - name: Quality
        run: npm run quality
      - name: Cache Chromium
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.0-chromium-${{ runner.os }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then python -m playwright install-deps chromium
          else python -m playwright install --with-deps chromium; fi
      - name: Tests
        env:
          J: 2
        run: npm test -- ${{ inputs.full && '--full' || '' }}
      - name: Save tested release asset
        if: inputs.full
        uses: actions/upload-artifact@v4
        with:
          name: browser-release
          path: dist/naranxia.html
          if-no-files-found: error
          retention-days: 7
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: dist/test-logs
          retention-days: 7
